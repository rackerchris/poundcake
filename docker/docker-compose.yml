x-poundcake-build: &poundcake-build
  context: ..
  dockerfile: Dockerfile

x-ui-build: &ui-build
  context: ..
  dockerfile: ui/Dockerfile

services:
  mariadb:
    image: mariadb:11.6
    container_name: poundcake-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-poundcake}
      POUNDCAKE_LOG_FORMAT: console
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - poundcake
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  poundcake-bootstrap:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-bootstrap
    user: "0:0"
    working_dir: /app
    environment: &poundcake-env
      PYTHONPATH: /app
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_migrator:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_ENABLED_PLUGINS: alertmanager,dummy,git,github,prometheus,genestack_monitoring
      POUNDCAKE_AUTH_ENABLED: "true"
      POUNDCAKE_AUTH_SESSION_TIMEOUT: "${POUNDCAKE_AUTH_SESSION_TIMEOUT:-900}"
      POUNDCAKE_AUTH_ABSOLUTE_MAX_SESSION: "${POUNDCAKE_AUTH_ABSOLUTE_MAX_SESSION:-28800}"
      POUNDCAKE_AUTH_DEV_USERNAME: ${POUNDCAKE_AUTH_DEV_USERNAME:-admin}
      POUNDCAKE_AUTH_DEV_PASSWORD: ${POUNDCAKE_AUTH_DEV_PASSWORD:-poundcake-dev}
      POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ${POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY:-poundcake-dev-plugin-credential-key}
      POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY: ${POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY:-poundcake-dev-service-identity-key}
      POUNDCAKE_AUTH_VERIFIER_DATABASE_URL: mysql+pymysql://poundcake_auth_verifier:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_PLUGIN_OPERATION_DB_URL: mysql+pymysql://poundcake_plugin_operation:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_LOG_LEVEL: INFO
      POUNDCAKE_LOG_FORMAT: console
      POUNDCAKE_APP_VERSION: "1.0.0"
      SERVICE_NAME: poundcake-bootstrap
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks:
      - poundcake
    command: sh -ec "python3 -m alembic upgrade head && python3 -m api.scripts.bootstrap_plugins"
    restart: "no"

  api:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-api
    working_dir: /app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      <<: *poundcake-env
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_api:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      SERVICE_NAME: api
      POUNDCAKE_LOG_LEVEL: DEBUG
      POUNDCAKE_DUMMY_HEALTH_STATUS: ${POUNDCAKE_DUMMY_HEALTH_STATUS:-healthy}
      POUNDCAKE_DUMMY_HEALTH_MESSAGE: ${POUNDCAKE_DUMMY_HEALTH_MESSAGE:-Dummy plugin ready}
    depends_on:
      mariadb:
        condition: service_healthy
      poundcake-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    ports:
      - "8000:8000"
    networks:
      - poundcake
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  ui:
    build: *ui-build
    image: poundcake-ui:local
    container_name: poundcake-ui
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - poundcake
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  prep-chef:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-prep-chef
    working_dir: /app
    environment:
      <<: *poundcake-env
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_prep_chef_reader:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_API_URL: http://api:8000
      PREP_INTERVAL: ${PREP_INTERVAL:-2}
      PREP_CHEF_LIMIT: ${PREP_CHEF_LIMIT:-50}
      SERVICE_NAME: prep-chef
      POUNDCAKE_INTERNAL_HMAC_SERVICE_TYPE: prep-chef
      POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ""
    depends_on:
      api:
        condition: service_healthy
      poundcake-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    networks:
      - poundcake
    command: python3 kitchen/prep_chef.py
    restart: unless-stopped

  dishwasher:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-dishwasher
    working_dir: /app
    environment:
      <<: *poundcake-env
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_dishwasher_reader:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_API_URL: http://api:8000
      DISHWASHER_INTERVAL: ${DISHWASHER_INTERVAL:-30}
      SERVICE_NAME: dishwasher
      POUNDCAKE_INTERNAL_HMAC_SERVICE_TYPE: dishwasher
      POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ""
    depends_on:
      api:
        condition: service_healthy
      poundcake-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    networks:
      - poundcake
    command: python3 kitchen/dishwasher.py
    restart: unless-stopped

  timer:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-timer
    working_dir: /app
    environment:
      <<: *poundcake-env
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_timer_reader:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_API_URL: http://api:8000
      TIMER_INTERVAL: ${TIMER_INTERVAL:-2}
      TIMER_LIMIT: ${TIMER_LIMIT:-50}
      SERVICE_NAME: timer
      POUNDCAKE_INTERNAL_HMAC_SERVICE_TYPE: timer
      POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ""
    depends_on:
      api:
        condition: service_healthy
      poundcake-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    networks:
      - poundcake
    command: python3 kitchen/timer.py
    restart: unless-stopped

  expediter-runner:
    build: *poundcake-build
    image: poundcake:local
    container_name: poundcake-expediter-runner
    working_dir: /app
    environment:
      <<: *poundcake-env
      POUNDCAKE_DATABASE_URL: mysql+pymysql://poundcake_expediter_runner_reader:poundcake@mariadb:3306/${DB_NAME:-poundcake}
      POUNDCAKE_API_URL: http://api:8000
      EXPEDITER_RUNNER_INTERVAL: ${EXPEDITER_RUNNER_INTERVAL:-2}
      EXPEDITER_RUNNER_LIMIT: ${EXPEDITER_RUNNER_LIMIT:-50}
      SERVICE_NAME: expediter-runner
      POUNDCAKE_INTERNAL_HMAC_SERVICE_TYPE: expediter-runner
      POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY: ""
    depends_on:
      api:
        condition: service_healthy
      poundcake-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    networks:
      - poundcake
    command: python3 kitchen/expediter_runner.py
    restart: unless-stopped

networks:
  poundcake:
    driver: bridge

volumes:
  mariadb_data:
