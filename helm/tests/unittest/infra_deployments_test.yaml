suite: infra-deployments
templates:
  - templates/poundcake-infra-deployments.yaml
tests:
  - it: renders mariadb probes and default writable infra security context
    asserts:
      - equal:
          path: metadata.name
          value: poundcake-mariadb
        documentIndex: 0
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
        documentIndex: 0
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
        documentIndex: 0

  - it: applies infra log-streaming labels
    asserts:
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-group"]
          value: infra
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-subgroup"]
          value: data
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-role"]
          value: mariadb
        documentIndex: 0

  - it: defaults infra deployments to worker nodes
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-role.kubernetes.io/worker"]
          value: worker
        documentIndex: 0

  - it: disables Kubernetes service environment variable injection
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 0

  - it: uses Recreate strategy for pvc-backed infra deployments
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentIndex: 0

  - it: does not render pull secrets from poundcakeImage settings
    set:
      poundcakeImage.pullSecrets[0]: ghcr-pull
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentIndex: 0
