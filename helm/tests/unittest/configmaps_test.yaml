suite: configmaps
templates:
  - templates/poundcake-configmaps.yaml
tests:
  - it: renders PoundCake configmaps
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: poundcake-scripts
        documentIndex: 0
      - equal:
          path: metadata.name
          value: poundcake-alembic
        documentIndex: 1

  - it: includes expected config data entries
    asserts:
      - isNotNull:
          path: data["mariadb-init.sh"]
        documentIndex: 0
      - matchRegex:
          path: data["alembic.ini"]
          pattern: "script_location = alembic"
        documentIndex: 1
      - isNotNull:
          path: data["env.py"]
        documentIndex: 1
