suite: configmaps
templates:
  - templates/poundcake-configmaps.yaml
tests:
  - it: renders PoundCake configmaps
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: poundcake-scripts
        documentIndex: 0

  - it: includes expected config data entries
    asserts:
      - isNotNull:
          path: data["mariadb-init.sh"]
        documentIndex: 0
