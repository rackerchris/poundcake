suite: startup-order-jobs
templates:
  - templates/poundcake-startup-jobs.yaml
tests:
  - it: renders the PoundCake startup job sequence
    asserts:
      - hasDocuments:
          count: 7
      - equal:
          path: metadata.name
          value: poundcake-mariadb-ready
        documentIndex: 0
      - equal:
          path: metadata.name
          value: poundcake-mariadb-users
        documentIndex: 1
      - equal:
          path: metadata.name
          value: poundcake-migrate
        documentIndex: 2
      - equal:
          path: metadata.name
          value: poundcake-mariadb-grants
        documentIndex: 3
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-plugin-registry
        documentIndex: 4
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-service-identity
        documentIndex: 5
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-adapter-credentials
        documentIndex: 6
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 4
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 6

  - it: runs PoundCake migrations and split bootstrap stages with isolated personas
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "alembic upgrade head"
        documentIndex: 2
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_plugin_registry"
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ENABLED_PLUGINS
            value: dummy
        documentIndex: 4
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_service_identities"
        documentIndex: 5
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_adapter_credentials"
        documentIndex: 6
      - equal:
          path: spec.template.spec.serviceAccountName
          value: poundcake-startup
        documentIndex: 0

  - it: disables Kubernetes service environment variable injection
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 1
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 2
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 3
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 4
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 5
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 6

  - it: applies startup image and pull-secret wiring
    set:
      poundcakeImage.repository: example/poundcake
      poundcakeImage.tag: test
      poundcakeImage.pullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/poundcake:test
        documentIndex: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/poundcake:test
        documentIndex: 4
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/poundcake:test
        documentIndex: 5
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred
        documentIndex: 5
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/poundcake:test
        documentIndex: 6
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred
        documentIndex: 6

  - it: allows startup hook ttl override
    set:
      startupHooks.cleanup.ttlSecondsAfterFinished: 60
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 4
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 6

  - it: injects monitoring backend urls only into plugin-registry and adapter-credential bootstrap stages
    set:
      monitoring.enabled: true
      monitoring.prometheus.url: http://prometheus.example.test:9090
      monitoring.prometheus.crdNamespace: monitoring
      monitoring.alertmanager.url: http://alertmanager.example.test:9093
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_URL
            value: http://prometheus.example.test:9090
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALERTMANAGER_URL
            value: http://alertmanager.example.test:9093
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_CRD_NAMESPACE
            value: monitoring
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_URL
            value: http://prometheus.example.test:9090
        documentIndex: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALERTMANAGER_URL
            value: http://alertmanager.example.test:9093
        documentIndex: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_CRD_NAMESPACE
            value: monitoring
        documentIndex: 6

  - it: isolates bootstrap encryption keys and startup database users by stage
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PLUGIN_REGISTRY_USER
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SERVICE_IDENTITY_MANAGER_USER
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_CREDENTIAL_MANAGER_USER
        documentIndex: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 6
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 6
