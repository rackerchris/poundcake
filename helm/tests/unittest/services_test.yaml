suite: services
templates:
  - templates/poundcake-services.yaml
tests:
  - it: renders PoundCake services
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: poundcake-mariadb
        documentIndex: 0
      - equal:
          path: metadata.name
          value: poundcake-api
        documentIndex: 1
      - equal:
          path: metadata.name
          value: poundcake-ui
        documentIndex: 2

  - it: renders poundcake-api service with values-driven type and port
    set:
      services.api.type: NodePort
      services.api.port: 9000
    asserts:
      - equal:
          path: metadata.name
          value: poundcake-api
        documentIndex: 1
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 9000
        documentIndex: 1
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
        documentIndex: 1

  - it: applies UI targetPort override from uiImage.containerPort
    set:
      uiImage.containerPort: 18080
    asserts:
      - equal:
          path: metadata.name
          value: poundcake-ui
        documentIndex: 2
      - equal:
          path: spec.ports[0].targetPort
          value: 18080
        documentIndex: 2
