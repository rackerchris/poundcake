suite: poundcake-workloads
templates:
  - templates/poundcake-workloads.yaml
tests:
  - it: renders all poundcake workloads
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: poundcake-api
        documentIndex: 0
      - equal:
          path: metadata.name
          value: poundcake-dishwasher
        documentIndex: 5
      - equal:
          path: metadata.name
          value: poundcake-expediter-runner
        documentIndex: 4
      - equal:
          path: metadata.name
          value: poundcake-ui
        documentIndex: 1

  - it: applies log-streaming labels to poundcake pod templates
    asserts:
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-group"]
          value: poundcake
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-subgroup"]
          value: app
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-role"]
          value: api
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["poundcake.io/log-role"]
          value: worker
        documentIndex: 4

  - it: defaults poundcake workloads to worker nodes
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-role.kubernetes.io/worker"]
          value: worker
        documentIndex: 0
      - equal:
          path: spec.template.spec.nodeSelector["node-role.kubernetes.io/worker"]
          value: worker
        documentIndex: 4

  - it: disables Kubernetes service environment variable injection
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 1
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 2
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 3
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 4
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 5

  - it: applies image and interval values to key containers
    set:
      poundcakeImage.repository: custom/poundcake
      poundcakeImage.tag: "2.0.0"
      poundcakeImage.pullPolicy: Always
      config.logLevel: WARNING
      uiImage.repository: custom/poundcake-ui
      uiImage.tag: "2.0.0"
      uiImage.pullPolicy: Always
      uiImage.containerPort: 18080
      intervals.timer: "42"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: custom/poundcake:2.0.0
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        documentIndex: 0
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_LOG_LEVEL
            value: "WARNING"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIMER_INTERVAL
            value: "42"
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_LOG_LEVEL
            value: "WARNING"
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_LOG_LEVEL
            value: "WARNING"
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_LOG_LEVEL
            value: "WARNING"
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_LOG_LEVEL
            value: "WARNING"
        documentIndex: 5
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        documentIndex: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: custom/poundcake-ui:2.0.0
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 18080
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 18080
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 18080
        documentIndex: 1

  - it: sets explicit non-wildcard cors origins on the api deployment by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALLOWED_ORIGINS
            value: "[\"http://poundcake.local\",\"http://ui.poundcake.local\",\"https://poundcake.local\",\"https://ui.poundcake.local\"]"
        documentIndex: 0

  - it: omits legacy worker environment variables
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
        documentIndex: 2
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PREP_INTERVAL
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLA_BUFFER_PERCENT
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_INCIDENT_RECONCILE_INTERVAL_SECONDS
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_INCIDENT_RECONCILE_LIMIT
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISHWASHER_DEFAULT_DURATION
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISHWASHER_DEFAULT_TIMEOUT
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISHWASHER_PRUNE_MISSING
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISHWASHER_INTERVAL
        documentIndex: 5

  - it: applies worker replica counts for horizontally scaled internal plugins
    set:
      prepChef.replicaCount: 3
      expediterRunner.replicaCount: 2
      timer.replicaCount: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 2
      - equal:
          path: spec.replicas
          value: 4
        documentIndex: 3
      - equal:
          path: spec.replicas
          value: 2
        documentIndex: 4

  - it: applies configured poundcake API readiness initial delay
    set:
      poundcakeApi.readiness.initialDelaySeconds: 9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 9
        documentIndex: 0

  - it: applies configured poundcake API probe settings
    set:
      poundcakeApi.readiness.periodSeconds: 7
      poundcakeApi.readiness.timeoutSeconds: 8
      poundcakeApi.readiness.failureThreshold: 9
      poundcakeApi.liveness.initialDelaySeconds: 41
      poundcakeApi.liveness.periodSeconds: 11
      poundcakeApi.liveness.timeoutSeconds: 12
      poundcakeApi.liveness.failureThreshold: 13
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 7
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 8
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 9
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 41
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 11
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 12
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 13
        documentIndex: 0

  - it: injects monitoring backend urls when enabled
    set:
      monitoring.enabled: true
      monitoring.prometheus.url: http://prometheus.example.test:9090
      monitoring.prometheus.crdNamespace: monitoring
      monitoring.alertmanager.url: http://alertmanager.example.test:9093
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_URL
            value: http://prometheus.example.test:9090
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALERTMANAGER_URL
            value: http://alertmanager.example.test:9093
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_CRD_NAMESPACE
            value: monitoring
        documentIndex: 0

  - it: binds workloads to the poundcake service account
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-poundcake
        documentIndex: 0
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-poundcake
        documentIndex: 4
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-poundcake
        documentIndex: 1

  - it: defaults PoundCake workload image tag to chart appVersion when unset
    set:
      poundcakeImage.tag: ""
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/rackerlabs/poundcake:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/rackerlabs/poundcake:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 2
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/rackerlabs/poundcake:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/rackerlabs/poundcake:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 4

  - it: defaults UI workload image tag to chart appVersion when unset
    set:
      uiImage.tag: ""
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/rackerlabs/poundcake-ui:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 1

  - it: reports API version from the deployed PoundCake image tag
    set:
      poundcakeImage.tag: "2.0.999"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_APP_VERSION
            value: "2.0.999"
        documentIndex: 0

  - it: supports immutable digest image references for PoundCake workloads
    set:
      poundcakeImage.repository: ghcr.io/example/poundcake
      poundcakeImage.tag: ""
      poundcakeImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/poundcake@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        documentIndex: 0

  - it: defaults UI container and probe ports to 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080
        documentIndex: 1

  - it: mounts writable nginx runtime paths on UI by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: ui-nginx-confd
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/nginx/conf.d
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: ui-nginx-cache
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /var/cache/nginx
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: ui-nginx-run
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].mountPath
          value: /var/run
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[1].name
          value: ui-nginx-confd
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[2].name
          value: ui-nginx-cache
        documentIndex: 1
      - equal:
          path: spec.template.spec.volumes[3].name
          value: ui-nginx-run
        documentIndex: 1
      - isNotNull:
          path: spec.template.spec.volumes[1].emptyDir
        documentIndex: 1
      - isNotNull:
          path: spec.template.spec.volumes[2].emptyDir
        documentIndex: 1
      - isNotNull:
          path: spec.template.spec.volumes[3].emptyDir
        documentIndex: 1

  - it: allows disabling writable nginx runtime path mounts for UI
    set:
      uiImage.runtimeWritablePaths.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
        documentIndex: 1
      - isNull:
          path: spec.template.spec.volumes[1]
        documentIndex: 1

  - it: applies pod, app, and utility security contexts with writable defaults
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
        documentIndex: 1

  - it: gates UI startup on API reachability and bootstrap marker
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-stage10
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "gate_wait_for_tcp \\\"poundcake-api\\\" \\\"8000\\\""
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "gate_wait_for_http_status \\\"http://poundcake-api.NAMESPACE.svc.cluster.local:8000/readyz\\\""
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "GATE_LOG_ENABLED=\\\"true\\\""
        documentIndex: 1

  - it: uses services.api.port for PoundCake service URLs
    set:
      services.api.port: 9000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: http://poundcake-api.NAMESPACE.svc.cluster.local:9000
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "gate_wait_for_tcp \\\"poundcake-api\\\" \\\"9000\\\""
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "gate_wait_for_http_status \\\"http://poundcake-api.NAMESPACE.svc.cluster.local:9000/readyz\\\""
        documentIndex: 1

  - it: supports gate logging overrides on poundcake init gates
    set:
      startupHooks.gateLogging.enabled: false
      startupHooks.gateLogging.intervalSeconds: 7
      startupHooks.gateLogging.prefix: "[pc-gate]"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "GATE_LOG_ENABLED=\\\"false\\\""
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "GATE_LOG_INTERVAL=\\\"7\\\""
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "GATE_LOG_PREFIX=\\\"\\[pc-gate\\]\\\""
        documentIndex: 0

  - it: supports hardened overrides for app and utility container profiles
    set:
      poundcakeImage.securityContext.readOnlyRootFilesystem: true
      utilitySecurityContext.readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 2
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 2

  - it: does not render image pull secrets by default
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentIndex: 0
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentIndex: 2
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentIndex: 3
      - isNull:
          path: spec.template.spec.imagePullSecrets
        documentIndex: 4

  - it: renders poundcakeImage pull secrets on PoundCake workloads
    set:
      poundcakeImage.pullSecrets[0]: registry-creds
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-creds
        documentIndex: 0
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-creds
        documentIndex: 2
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-creds
        documentIndex: 3
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-creds
        documentIndex: 4

  - it: injects scoped credential keys into api and worker workloads when auth is enabled
    set:
      auth.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_ENABLED
            value: "true"
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-poundcake-admin
                key: username
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-poundcake-admin
                key: password
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 2
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5

  - it: omits internal auth env vars when auth is disabled
    set:
      auth.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_ENABLED
            value: "false"
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_USERNAME
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_AUTH_PASSWORD
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 2
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 1
