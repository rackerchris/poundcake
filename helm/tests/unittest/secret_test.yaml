suite: secret
templates:
  - templates/poundcake-secret.yaml
tests:
  - it: uses provided secret values when explicitly set
    set:
      auth.enabled: false
      secrets.dbRootPassword: root-pass
      secrets.dbMigratorPassword: migrator-pass
      secrets.dbPluginRegistryPassword: plugin-registry-pass
      secrets.dbApiPassword: api-pass
      secrets.dbAuthVerifierPassword: auth-verifier-pass
      secrets.dbServiceIdentityManagerPassword: service-identity-manager-pass
      secrets.dbCredentialManagerPassword: credential-pass
      secrets.dbPrepChefReaderPassword: prep-chef-pass
      secrets.dbTimerReaderPassword: timer-pass
      secrets.dbExpediterRunnerReaderPassword: expediter-runner-pass
      secrets.dbDishwasherReaderPassword: dishwasher-pass
      secrets.dbReadonlyPassword: readonly-pass
      secrets.pluginCredentialEncryptionKey: adapter-key
      secrets.serviceIdentityCredentialEncryptionKey: service-identity-key
    asserts:
      - equal:
          path: stringData.DB_ROOT_PASSWORD
          value: root-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_MIGRATOR_PASSWORD
          value: migrator-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_PLUGIN_REGISTRY_PASSWORD
          value: plugin-registry-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_API_PASSWORD
          value: api-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_AUTH_VERIFIER_PASSWORD
          value: auth-verifier-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_SERVICE_IDENTITY_MANAGER_PASSWORD
          value: service-identity-manager-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_CREDENTIAL_MANAGER_PASSWORD
          value: credential-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_PREP_CHEF_READER_PASSWORD
          value: prep-chef-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_TIMER_READER_PASSWORD
          value: timer-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_EXPEDITER_RUNNER_READER_PASSWORD
          value: expediter-runner-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_DISHWASHER_READER_PASSWORD
          value: dishwasher-pass
        documentIndex: 0
      - equal:
          path: stringData.DB_READONLY_PASSWORD
          value: readonly-pass
        documentIndex: 0
      - equal:
          path: stringData.PLUGIN_CREDENTIAL_ENCRYPTION_KEY
          value: adapter-key
        documentIndex: 0
      - equal:
          path: stringData.SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
          value: service-identity-key
        documentIndex: 0

  - it: auto-generates non-empty passwords when values are blank
    set:
      auth.enabled: false
      secrets.dbRootPassword: ""
      secrets.dbMigratorPassword: ""
      secrets.dbPluginRegistryPassword: ""
      secrets.dbApiPassword: ""
      secrets.dbAuthVerifierPassword: ""
      secrets.dbServiceIdentityManagerPassword: ""
      secrets.dbCredentialManagerPassword: ""
      secrets.dbPrepChefReaderPassword: ""
      secrets.dbTimerReaderPassword: ""
      secrets.dbExpediterRunnerReaderPassword: ""
      secrets.dbDishwasherReaderPassword: ""
      secrets.dbReadonlyPassword: ""
      secrets.pluginCredentialEncryptionKey: ""
      secrets.serviceIdentityCredentialEncryptionKey: ""
    asserts:
      - matchRegex:
          path: stringData.DB_ROOT_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_MIGRATOR_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_PLUGIN_REGISTRY_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_API_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_AUTH_VERIFIER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_SERVICE_IDENTITY_MANAGER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_CREDENTIAL_MANAGER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_PREP_CHEF_READER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_TIMER_READER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_EXPEDITER_RUNNER_READER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_DISHWASHER_READER_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.DB_READONLY_PASSWORD
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.PLUGIN_CREDENTIAL_ENCRYPTION_KEY
          pattern: ".+"
        documentIndex: 0
      - matchRegex:
          path: stringData.SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
          pattern: ".+"
        documentIndex: 0
