suite: poddisruptionbudgets
templates:
  - templates/poundcake-poddisruptionbudgets.yaml
tests:
  - it: renders PoundCake PDBs by default with maxUnavailable policy
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 0
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 1

  - it: does not render any PDB when disabled
    set:
      pdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0
