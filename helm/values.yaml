#

# Default values for PoundCake
#
# Namespace behavior:
# - direct Helm installs use the namespace you pass with `--namespace`
# - the bundled installer defaults `POUNDCAKE_NAMESPACE` to `poundcake`
# - each release renders into a single namespace; split installs use separate releases
#
# High-level chart shape:
# - PoundCake API + UI + workers
# - PoundCake DB can be embedded or shared-operator backed

replicaCount: 1

# Service selection:
# - poundcake.enabled=true renders PoundCake resources
poundcake:
  enabled: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Service account for PoundCake workloads and startup/bootstrap hooks.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

# UI configuration
# The UI is a separate container built and stored independently in GitHub container registry.
# It connects to the API service in the same namespace.
ui:
  enabled: true
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example:
  #   kubernetes.io/ingress.class: nginx
  #   kubernetes.io/tls-acme: "true"
  hosts:
    - host: poundcake.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: poundcake-tls
  #    hosts:
  #      - poundcake.local

# Gateway API route attachment configuration.
# When enabled, PoundCake renders HTTPRoutes that attach to an existing Gateway.
# PoundCake does not create a Gateway resource.
gateway:
  enabled: false

  # Parent Gateway reference.
  # gatewayName should point to an existing shared Gateway.
  # gatewayNamespace is optional; if omitted, the HTTPRoute namespace is used.
  gatewayName: poundcake-gateway
  gatewayNamespace: ""  # Example: <gateway-namespace>

  # Existing listener section on the parent Gateway.
  listener:
    # Existing listener section name on parent Gateway (used as HTTPRoute parentRefs.sectionName)
    name: ""  # Example: <gateway-listener-name>

    # Optional default hostname used by both API/UI HTTPRoutes when gateway.hostnames is empty.
    hostname: ""  # Example: poundcake.example.com

  # HTTPRoute hostnames. Applied to both API and UI routes.
  # If empty, listener.hostname is used.
  # - poundcake.example.com
  hostnames: []

  # Optional annotations for HTTPRoute
  annotations: {}
  # Example:
  #   application: gateway-api
  #   route: poundcake

  # Per-route Gateway settings.
  listeners:
    # If api/ui share hostname+port+protocol, chart renders one listener (api)
    # and attaches both HTTPRoutes to that section.
    api:
      enabled: true
      hostname: api.poundcake.local
      port: 80
      protocol: HTTP
      # Increase request timeout for long-running repo sync operations such as bulk imports.
      requestTimeout: "300s"
      backendRequestTimeout: "300s"
      tls:
        mode: Terminate
        secretName: ""
      pathPrefix: /
    ui:
      enabled: true
      hostname: ui.poundcake.local
      port: 80
      protocol: HTTP
      tls:
        mode: Terminate
        secretName: ""
      pathPrefix: /

  # Session persistence configuration
  sessionPersistence:
    enabled: true
    timeout: "300s"
    cookieLifetimeType: "Permanent"  # or "Session"
    cookieName: "PoundcakeSession"
    uiCookieName: "PoundcakeUISession"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  # Set to {} to disable worker-only scheduling or override with your cluster's worker label/value.
  node-role.kubernetes.io/worker: "worker"

tolerations: []

affinity: {}

# PoundCake configuration
config:
  # Server settings
  host: "0.0.0.0"
  port: 8080
  debug: false

  # Logging
  logLevel: INFO
  logFormat: console

  # Metrics
  metricsEnabled: true
  metricsPath: /metrics

  # Remediation settings
  defaultTimeout: 300
  maxConcurrentRemediations: 10
  # Service plugins enabled at bootstrap. Production Helm does not infer external
  # adapter enablement or inject adapter credentials; operators manage adapter
  # connection records through PoundCake and credential-manager.
  enabledPlugins: "dummy"

# Alert suppression behavior in PoundCake API
suppressions:
  enabled: true
  lifecycleEnabled: true
  lifecycleIntervalSeconds: 30
  lifecycleBatchLimit: 25

# Alert-to-action mappings
# These will be mounted as ConfigMap
mappings:
  common.yaml: |
    orders:
      HighCPUUsage:
        description: "Remediate high CPU usage"
        handler: yaml_config
        actions:
          - name: identify_cpu_process
            action: core.remote
            description: "Identify CPU-intensive processes"
            parameters:
              hosts: "{{instance}}"
              cmd: "ps aux --sort=-%cpu | head -10"
            timeout: 60

      LowDiskSpace:
        description: "Clean up disk space"
        handler: yaml_config
        actions:
          - name: cleanup_logs
            action: core.remote
            description: "Clean up old log files"
            parameters:
              hosts: "{{instance}}"
              cmd: "find /var/log -name '*.gz' -mtime +7 -delete"
            timeout: 120

      ServiceDown:
        description: "Restart down services"
        handler: yaml_config
        actions:
          - name: restart_service
            action: linux.service
            parameters:
              host: "{{instance}}"
              service: "{{labels.service}}"
              action: restart
            timeout: 120

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: true
  namespace: prometheus
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Persistence for writable mappings (required for web UI edits)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 100Mi
  storageClassName: ""
  mariadb:
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClassName: ""
  config:
    size: 1Gi
    accessMode: ReadWriteMany
    storageClassName: ""
longhorn:
  rwxStorageClass:
    create: false
    name: longhorn-rwx
    isDefaultClass: false
    numberOfReplicas: "3"
    staleReplicaTimeout: "30"
    fsType: ext4
    dataLocality: disabled
    migratable: "false"
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true

# Optional Kubernetes RBAC for external service plugins. These grants only
# authorize the PoundCake service account against cluster APIs; adapter runtime
# configuration and secrets must still be stored through credential-manager.
servicePluginRbac:
  prometheusRules:
    enabled: true
  podActions:
    enabled: true
  workloadTriage:
    enabled: true
  nodeTriage:
    enabled: true

# Optional external monitoring backend URLs for plugin health/config validation.
# These services are not rendered by the PoundCake chart; devstack installs them
# as separate Helm releases and production should supply existing service URLs.
monitoring:
  enabled: false
  prometheus:
    url: ""
    crdNamespace: "prometheus"
  alertmanager:
    url: ""

# Authentication configuration
auth:
  # Enable authentication for web UI and API
  enabled: true
  # Browser origins allowed to send cross-origin UI requests to the API.
  # Keep this explicit in production; do not use ["*"] when browser OIDC login
  # is enabled.
  allowedOrigins:
    - http://poundcake.local
    - http://ui.poundcake.local
    - https://poundcake.local
    - https://ui.poundcake.local
  # Session timeout in seconds (default: 15 min sliding TTL)
  sessionTimeout: 900
  # OIDC state token lifetime in seconds for browser login providers.
  oidcStateTtl: 600
  # Absolute maximum session lifetime in seconds (8 hours).
  # Sessions cannot be refreshed beyond this cap.
  absoluteMaxSession: 28800
  # Secret name will be: <release-name>-poundcake-admin
  # Get password with: kubectl get secret <release-name>-poundcake-admin -n <namespace> -o jsonpath='{.data.password}' | base64 -d
  # Access page manages role bindings only. Provider enablement happens here at deploy time.

  local:
    # Keep the bootstrap superuser enabled as the recovery account.
    enabled: true

  activeDirectory:
    enabled: false
    serverUri: ""
    userBaseDn: ""
    bindDn: ""
    userFilter: "(&(objectClass=user)(sAMAccountName={username}))"
    groupAttribute: "memberOf"
    displayNameAttribute: "displayName"
    usernameAttribute: "sAMAccountName"
    subjectAttribute: "distinguishedName"
    useSsl: true
    validateTls: true
    groupNameRegex: "CN=([^,]+)"
    existingSecret: ""
    secretKeys:
      bindPassword: "bind-password"
    caBundle:
      existingSecret: ""
      key: "ca.crt"
      mountPath: "/run/secrets/poundcake-ad"
      fileName: "ca.crt"

  auth0:
    enabled: false
    shared:
      domain: ""
      audience: ""
      scope: "openid profile email"
      organization: ""
      connection: ""
      usernameClaim: "email"
      displayNameClaim: "name"
      groupsClaim: "groups"
      subjectClaim: "sub"
    ui:
      enabled: false
      clientId: ""
      callbackUrl: ""
      existingSecret: ""
      secretKeys:
        clientSecret: "client-secret"
    cli:
      enabled: false
      clientId: ""
      existingSecret: ""
      secretKeys:
        clientSecret: "client-secret"

  azureAd:
    enabled: false
    shared:
      tenant: ""
      scope: "openid profile email"
      usernameClaim: "preferred_username"
      displayNameClaim: "name"
      groupsClaim: "groups"
      subjectClaim: "sub"
    ui:
      enabled: false
      clientId: ""
      callbackUrl: ""
      existingSecret: ""
      secretKeys:
        clientSecret: "client-secret"
    cli:
      enabled: false
      clientId: ""

# Database configuration (MySQL/MariaDB) for PoundCake API only.
database:
  # Database deployment mode for PoundCake:
  # - embedded: deploy in-chart poundcake-mariadb Deployment/Service/PVC
  # - shared_operator: use an existing MariaDB operator server and create PoundCake DB/User/Grant CRs
  mode: embedded

  sharedOperator:
    # MariaDB server/service name used when mode=shared_operator.
    serverName: ""
    # Namespace where the MariaDB server CR/service lives. Empty defaults to release namespace.
    namespace: ""
    # Create PoundCake Database/User/Grant CR resources against shared server.
    provisionResources: true

  # Database connection URL
  # Format: mysql+pymysql://user:password@host:port/database
  url: ""
  # Reference to existing secret containing database URL
  existingSecret: ""
  secretKey: "database-url"

# MariaDB Operator integration
# When enabled, PoundCake will create MariaDB resources using the mariadb-operator CRDs
# Requires mariadb-operator to be installed: https://github.com/mariadb-operator/mariadb-operator
mariadbOperator:
  # Enable MariaDB Operator integration
  # When true, the chart will check for the operator and create MariaDB CRDs
  enabled: true

  # Namespace to deploy MariaDB resources (defaults to release namespace)
  namespace: ""

  # MariaDB server configuration
  server:
    # Name of the MariaDB instance (defaults to release name)
    name: ""
    # MariaDB version
    image:
      repository: mariadb
      tag: "11.4"
      pullPolicy: IfNotPresent
    # Root password (auto-generated if not provided)
    rootPassword: ""
    # Use existing secret for root password
    rootPasswordSecret: ""
    rootPasswordSecretKey: "password"
    # Storage configuration
    storage:
      size: 10Gi
      storageClassName: ""
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Number of replicas (1 for standalone, 3+ for Galera)
    replicas: 1

  # Database configuration
  database:
    # Database name to create
    name: poundcake

  # User configuration
  user:
    # Max connections for this user
    maxUserConnections: 20

# Prep chef service configuration
# Polls API and converts new orders into dishes.
prepChef:
  enabled: true
  replicaCount: 1
  interval: 5
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Timer service configuration
# Monitoring service that tracks dish execution status
timer:
  enabled: true
  replicaCount: 1
  interval: 10
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Expediter Runner service configuration
# Performs workload execution for runner-dispatched dish ingredients.
expediterRunner:
  enabled: true
  replicaCount: 1
  interval: 2
  limit: 50
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Dishwasher service configuration
# Periodic sync job that reconciles PoundCake content/state.
dishwasher:
  enabled: true
  replicaCount: 1
  interval: 300
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Bootstrap runtime configuration
# Startup orchestration jobs are defined in poundcake-startup-jobs.yaml.
bootstrap:
  ingredientsDir: /app/bootstrap/ingredients
  recipesDir: /app/bootstrap/recipes
  remoteSyncEnabled: true
  # Remote sync only runs when a repo URL is explicitly configured.
  rulesRepoUrl: ""
  rulesBranch: main
  rulesPath: alerts
  # Legacy local bootstrap tuning; production startup now uses split jobs.
  poundcakeBootstrap:
    defaultDuration: 60
    defaultTimeout: 300
    pruneMissing: false

poundcakeImage:
  repository: ghcr.io/rackerlabs/poundcake
  tag: ""
  # Optional immutable image digest (sha256:...); overrides tag when set.
  digest: ""
  pullPolicy: Always
  pullSecrets: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

uiImage:
  repository: ghcr.io/rackerlabs/poundcake-ui
  tag: ""
  pullPolicy: Always
  containerPort: 8080
  nginxAccessLog: "off"
  runtimeWritablePaths:
    enabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

utilitySecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

images:
  mariadb: mariadb:11.6
  alpine: alpine:3.19
  busybox: busybox:1.36
  kubectl: bitnami/kubectl:latest

poundcakeApi:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 40
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  ticketing:
    rackspaceConfirmedSolvedStatus: "confirmed solved"

secrets:
  # REQUIRED: Provide these values or they will be randomly generated on install
  dbRootPassword: ""
  dbName: poundcake
  dbMigratorUser: poundcake_migrator
  dbMigratorPassword: ""
  dbPluginRegistryUser: poundcake_plugin_registry
  dbPluginRegistryPassword: ""
  dbApiUser: poundcake_api
  dbApiPassword: ""
  dbAuthVerifierUser: poundcake_auth_verifier
  dbAuthVerifierPassword: ""
  dbServiceIdentityManagerUser: poundcake_service_identity_manager
  dbServiceIdentityManagerPassword: ""
  dbCredentialManagerUser: poundcake_credential_manager
  dbCredentialManagerPassword: ""
  dbPluginOperationUser: poundcake_plugin_operation
  dbPluginOperationPassword: ""
  dbPrepChefReaderUser: poundcake_prep_chef_reader
  dbPrepChefReaderPassword: ""
  dbTimerReaderUser: poundcake_timer_reader
  dbTimerReaderPassword: ""
  dbExpediterRunnerReaderUser: poundcake_expediter_runner_reader
  dbExpediterRunnerReaderPassword: ""
  dbDishwasherReaderUser: poundcake_dishwasher_reader
  dbDishwasherReaderPassword: ""
  dbReadonlyUser: poundcake_readonly
  dbReadonlyPassword: ""
  pluginCredentialEncryptionKey: ""
  serviceIdentityCredentialEncryptionKey: ""
  webhookBearerToken: ""
services:
  api:
    type: ClusterIP
    port: 8000
    publishNotReadyAddresses: true
  ui:
    type: ClusterIP
    port: 80

intervals:
  prepChef: "5"
  expediterRunner: "2"
  timer: "10"
  prepInterval: "5"

logFormat: console

# Default resource requests and limits (can be overridden per component)
defaultResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Container security context for infrastructure services.
# Stateful images may need writable root filesystem for sockets/temp files.
infraSecurityContext:
  mariadb:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

startupHooks:
  gateLogging:
    enabled: true
    intervalSeconds: 30
    prefix: "[gate]"
  parallelWait:
    enabled: true
    failFast: true
    timeout: 15m
  cleanup:
    enabled: true
    deleteSuccessful: true
    deleteFailed: false
    ttlSecondsAfterFinished: 300

# Pod disruption budget settings
pdb:
  enabled: true
