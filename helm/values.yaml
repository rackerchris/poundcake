nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

poundcakeImage:
  repository: poundcake
  tag: latest
  pullPolicy: IfNotPresent

stackstormImage:
  repository: stackstorm/st2
  tag: "3.9.0"
  pullPolicy: IfNotPresent

images:
  mariadb: mariadb:11.6
  mongodb: mongo:7.0
  rabbitmq: rabbitmq:3.13-management
  redis: redis:7.4-alpine
  alpine: alpine:3.19
  busybox: busybox:1.36
  kubectl: bitnami/kubectl:1.30

secrets:
  dbRootPassword: ""
  dbName: poundcake
  dbUser: poundcake
  dbPassword: ""
  mongoRootPassword: ""
  mongoUsername: stackstorm
  mongoPassword: ""
  rabbitmqUser: stackstorm
  rabbitmqPassword: ""
  st2AuthUser: st2admin
  st2AuthPassword: ""

persistence:
  storageClassName: ""
  mariadb:
    size: 10Gi
  mongo:
    size: 10Gi
  rabbitmq:
    size: 5Gi
  redis:
    size: 2Gi
  stackstormPacks:
    size: 2Gi
  config:
    size: 1Gi

services:
  api:
    type: ClusterIP
    port: 8000
  stackstormApi:
    type: ClusterIP
    port: 9101
  stackstormAuth:
    type: ClusterIP
    port: 9100
  stackstormStream:
    type: ClusterIP
    port: 9102
  stackstormWeb:
    type: ClusterIP
    port: 8080

intervals:
  chef: "5"
  prepChef: "5"
  timer: "10"
  dishwasher: "300"
  prepInterval: "5"

logFormat: console

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
