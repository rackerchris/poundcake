{{- if .Values.stackstorm.chart.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "poundcake.fullname" . }}-stackstorm-bootstrap
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
    app.kubernetes.io/component: stackstorm-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "13"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stackstorm-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "poundcake.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: stackstorm-bootstrap
        image: "bitnami/kubectl:1.30"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail

          NS="{{ .Release.Namespace }}"
          ST2_API_URL="{{ include "poundcake.stackstormApiUrl" . }}"
          ST2_AUTH_URL="{{ include "poundcake.stackstormAuthUrl" . }}"
          ST2_AUTH_SECRET="{{ include "poundcake.stackstormAuthSecretName" . }}"
          ST2_AUTH_USER_DEFAULT="{{ .Values.stackstorm.adminUser }}"
          ST2_ADMIN_PASSWORD_SECRET="{{ .Values.stackstorm.adminPasswordSecret }}"
          ST2_ADMIN_PASSWORD_KEY="{{ .Values.stackstorm.adminPasswordSecretKey }}"
          API_KEY_SECRET="{{ include "poundcake.stackstormApiKeySecret" . }}"
          API_KEY_FIELD="{{ include "poundcake.stackstormApiKeySecretKey" . }}"
          READY_SECRET="{{ include "poundcake.stackstormBootstrapReadySecret" . }}"

          for cmd in kubectl curl sed base64; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              echo "ERROR: required command '${cmd}' not found"
              exit 1
            fi
          done

          get_secret_value() {
            secret_name="$1"
            secret_key="$2"
            kubectl -n "${NS}" get secret "${secret_name}" -o "jsonpath={.data['${secret_key}']}" 2>/dev/null | base64 -d 2>/dev/null || true
          }

          wait_for_api() {
            max_retries=120
            retry=0
            while [ "${retry}" -lt "${max_retries}" ]; do
              code="$(curl -s -o /dev/null -w "%{http_code}" "${ST2_API_URL}/v1/actions" || true)"
              if [ "${code}" = "200" ] || [ "${code}" = "401" ]; then
                return 0
              fi
              retry=$((retry + 1))
              sleep 5
            done
            return 1
          }

          get_auth_token() {
            user="$1"
            pass="$2"
            response="$(curl -s -X POST "${ST2_AUTH_URL}/tokens" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${user}\",\"password\":\"${pass}\"}" || true)"
            echo "${response}" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1
          }

          wait_for_api_key_secret() {
            max_retries=120
            retry=0
            while [ "${retry}" -lt "${max_retries}" ]; do
              api_key_value="$(kubectl -n "${NS}" get secret "${API_KEY_SECRET}" -o "jsonpath={.data['${API_KEY_FIELD}']}" 2>/dev/null || true)"
              if [ -n "${api_key_value}" ]; then
                return 0
              fi
              retry=$((retry + 1))
              sleep 5
            done
            return 1
          }

          st2_auth_user="${ST2_AUTH_USER_DEFAULT}"
          st2_auth_password=""
          discovered_user="$(get_secret_value "${ST2_AUTH_SECRET}" "username")"
          if [ -n "${discovered_user}" ]; then
            st2_auth_user="${discovered_user}"
          fi
          st2_auth_password="$(get_secret_value "${ST2_AUTH_SECRET}" "password")"
          if [ -z "${st2_auth_password}" ] && [ -n "${ST2_ADMIN_PASSWORD_SECRET}" ] && [ -n "${ST2_ADMIN_PASSWORD_KEY}" ]; then
            st2_auth_password="$(get_secret_value "${ST2_ADMIN_PASSWORD_SECRET}" "${ST2_ADMIN_PASSWORD_KEY}")"
          fi

          if [ -z "${st2_auth_password}" ]; then
            echo "ERROR: StackStorm admin password could not be resolved."
            exit 1
          fi

          echo "Stage 7: stackstorm bootstrap and pack registration."
          wait_for_api || { echo "ERROR: StackStorm API did not become ready."; exit 1; }
          wait_for_api_key_secret || { echo "ERROR: missing StackStorm API key secret."; exit 1; }

          token="$(get_auth_token "${st2_auth_user}" "${st2_auth_password}")"
          if [ -z "${token}" ]; then
            echo "ERROR: failed to acquire auth token for stackstorm bootstrap."
            exit 1
          fi

          # Register StackStorm packs/content via API.
          curl -sS -X POST "${ST2_API_URL}/v1/packs/register" \
            -H "X-Auth-Token: ${token}" \
            -H "Content-Type: application/json" \
            -d '{}' >/dev/null

          # Validate core actions are queryable after registration.
          code="$(curl -s -o /dev/null -w "%{http_code}" -H "X-Auth-Token: ${token}" "${ST2_API_URL}/v1/actions?pack=core" || true)"
          if [ "${code}" != "200" ]; then
            echo "ERROR: core actions validation failed after bootstrap."
            exit 1
          fi

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if kubectl -n "${NS}" get secret "${READY_SECRET}" >/dev/null 2>&1; then
            kubectl -n "${NS}" patch secret "${READY_SECRET}" --type merge \
              -p "{\"stringData\":{\"ready\":\"true\",\"updatedAt\":\"${ts}\"}}" >/dev/null
          else
            kubectl -n "${NS}" create secret generic "${READY_SECRET}" \
              --from-literal=ready=true \
              --from-literal=updatedAt="${ts}" >/dev/null
          fi

          echo "StackStorm bootstrap complete."
{{- end }}
