{{- if and .Values.stackstorm.chart.enabled .Values.stackstorm.startupOrder.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "poundcake.fullname" . }}-stackstorm-edge-init
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
    app.kubernetes.io/component: stackstorm-edge-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "12"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stackstorm-edge-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "poundcake.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: stackstorm-edge-init
        image: "bitnami/kubectl:1.30"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail

          NS="{{ .Release.Namespace }}"
          RELEASE_NAME="{{ .Release.Name }}"
          ST2_PREFIX="{{ include "poundcake.stackstormSubchartPrefix" . }}"
          TIMEOUT=600

          if ! command -v kubectl >/dev/null 2>&1; then
            echo "ERROR: kubectl not found"
            exit 1
          fi

          resolve_deployment_name() {
            component="$1"
            for candidate in "${ST2_PREFIX}-${component}" "${RELEASE_NAME}-${component}" "${component}"; do
              if kubectl -n "${NS}" get deployment "${candidate}" >/dev/null 2>&1; then
                echo "${candidate}"
                return 0
              fi
            done
            kubectl -n "${NS}" get deployment -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
              | grep -E "(-|^)${component}$" | head -n1 || true
          }

          scale_component_if_exists() {
            component="$1"
            replicas="$2"
            name="$(resolve_deployment_name "${component}")"
            if [ -n "${name}" ]; then
              kubectl -n "${NS}" scale deployment "${name}" --replicas="${replicas}" >/dev/null
              echo "Scaled ${name} -> ${replicas}"
            fi
          }

          wait_component_rollout_if_exists() {
            component="$1"
            name="$(resolve_deployment_name "${component}")"
            if [ -n "${name}" ]; then
              kubectl -n "${NS}" rollout status "deployment/${name}" --timeout="${TIMEOUT}s"
            fi
          }

          echo "Stage 6: scaling StackStorm edge components."
          scale_component_if_exists "st2sensorcontainer" {{ .Values.stackstorm.startupOrder.edgeReplicas.st2sensorcontainer | int }}
          scale_component_if_exists "st2stream" {{ .Values.stackstorm.startupOrder.edgeReplicas.st2stream | int }}
          scale_component_if_exists "st2web" {{ .Values.stackstorm.startupOrder.edgeReplicas.st2web | int }}

          wait_component_rollout_if_exists "st2sensorcontainer"
          wait_component_rollout_if_exists "st2stream"
          wait_component_rollout_if_exists "st2web"
{{- end }}
