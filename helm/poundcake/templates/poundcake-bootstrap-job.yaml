{{- if .Values.bootstrap.poundcakeBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "poundcake.fullname" . }}-bootstrap
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
    app.kubernetes.io/component: poundcake-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "40"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: poundcake-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "poundcake.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "poundcake.waitForStackstormBootstrapInitContainer" . | nindent 8 }}
        - name: wait-for-api
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for PoundCake API to be ready..."
              MAX_WAIT=600
              ELAPSED=0
              INTERVAL=5
              while [ "${ELAPSED}" -lt "${MAX_WAIT}" ]; do
                if curl -sf "http://{{ include "poundcake.fullname" . }}:{{ .Values.service.port }}/api/v1/health" >/dev/null 2>&1; then
                  echo "PoundCake API is ready."
                  exit 0
                fi
                echo "Waiting for API... (${ELAPSED}s / ${MAX_WAIT}s)"
                sleep "${INTERVAL}"
                ELAPSED=$((ELAPSED + INTERVAL))
              done
              echo "Timed out waiting for PoundCake API."
              exit 1
        - name: dishwasher-bootstrap
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "========================================"
              echo "PoundCake Bootstrap (dishwasher)"
              echo "========================================"
              python kitchen/dishwasher.py
              echo "Dishwasher bootstrap complete."
          env:
            - name: POUNDCAKE_API_URL
              value: "http://{{ include "poundcake.fullname" . }}:{{ .Values.service.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DISHWASHER_DEFAULT_DURATION
              value: {{ .Values.bootstrap.poundcakeBootstrap.defaultDuration | quote }}
            - name: DISHWASHER_DEFAULT_TIMEOUT
              value: {{ .Values.bootstrap.poundcakeBootstrap.defaultTimeout | quote }}
            - name: DISHWASHER_PRUNE_MISSING
              value: {{ .Values.bootstrap.poundcakeBootstrap.pruneMissing | quote }}
            - name: DISHWASHER_INTERVAL
              value: "0"
            - name: POUNDCAKE_BOOTSTRAP_MARK
              value: "true"
            - name: SERVICE_NAME
              value: "dishwasher-bootstrap"
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # Main container writes the ready-marker secret after all init containers succeed.
      containers:
        - name: mark-ready
          image: bitnami/kubectl:1.30
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              NS="{{ .Release.Namespace }}"
              READY_SECRET="{{ include "poundcake.poundcakeBootstrapReadySecret" . }}"
              TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Writing PoundCake bootstrap ready marker: ${READY_SECRET}"
              if kubectl -n "${NS}" get secret "${READY_SECRET}" >/dev/null 2>&1; then
                kubectl -n "${NS}" patch secret "${READY_SECRET}" --type merge \
                  -p "{\"stringData\":{\"ready\":\"true\",\"updatedAt\":\"${TS}\"}}" >/dev/null
              else
                kubectl -n "${NS}" create secret generic "${READY_SECRET}" \
                  --from-literal=ready=true \
                  --from-literal=updatedAt="${TS}" >/dev/null
              fi
              echo "========================================"
              echo "PoundCake Bootstrap Ready"
              echo "========================================"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
