{{- if and .Values.stackstorm.chart.enabled .Values.stackstorm.startupOrder.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "poundcake.fullname" . }}-stackstorm-core-init
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
    app.kubernetes.io/component: stackstorm-core-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stackstorm-core-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "poundcake.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: stackstorm-core-init
        image: "bitnami/kubectl:1.30"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail

          NS="{{ .Release.Namespace }}"
          RELEASE_NAME="{{ .Release.Name }}"
          ST2_PREFIX="{{ include "poundcake.stackstormSubchartPrefix" . }}"
          ST2_API_URL="{{ include "poundcake.stackstormApiUrl" . }}"
          ST2_AUTH_URL="{{ include "poundcake.stackstormAuthUrl" . }}"
          ST2_AUTH_SECRET="{{ include "poundcake.stackstormAuthSecretName" . }}"
          API_KEY_SECRET="{{ include "poundcake.stackstormApiKeySecret" . }}"
          API_KEY_FIELD="{{ include "poundcake.stackstormApiKeySecretKey" . }}"
          READY_SECRET="{{ include "poundcake.stackstormBootstrapReadySecret" . }}"
          ST2_AUTH_USER_DEFAULT="{{ .Values.stackstorm.adminUser }}"
          ST2_ADMIN_PASSWORD_SECRET="{{ .Values.stackstorm.adminPasswordSecret }}"
          ST2_ADMIN_PASSWORD_KEY="{{ .Values.stackstorm.adminPasswordSecretKey }}"
          TIMEOUT=600

          for cmd in kubectl curl sed base64; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              echo "ERROR: required command '${cmd}' not found"
              exit 1
            fi
          done

          resolve_deployment_name() {
            component="$1"
            for candidate in "${ST2_PREFIX}-${component}" "${RELEASE_NAME}-${component}" "${component}"; do
              if kubectl -n "${NS}" get deployment "${candidate}" >/dev/null 2>&1; then
                echo "${candidate}"
                return 0
              fi
            done
            kubectl -n "${NS}" get deployment -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
              | grep -E "(-|^)${component}$" | head -n1 || true
          }

          scale_component_if_exists() {
            component="$1"
            replicas="$2"
            name="$(resolve_deployment_name "${component}")"
            if [ -n "${name}" ]; then
              kubectl -n "${NS}" scale deployment "${name}" --replicas="${replicas}" >/dev/null
              echo "Scaled ${name} -> ${replicas}"
            fi
          }

          wait_component_rollout_if_exists() {
            component="$1"
            name="$(resolve_deployment_name "${component}")"
            if [ -n "${name}" ]; then
              kubectl -n "${NS}" rollout status "deployment/${name}" --timeout="${TIMEOUT}s"
            fi
          }

          wait_for_service_endpoints() {
            service_name="$1"
            max_retries=120
            retry=0
            while [ "${retry}" -lt "${max_retries}" ]; do
              endpoint="$(kubectl -n "${NS}" get endpoints "${service_name}" -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)"
              if [ -n "${endpoint}" ]; then
                echo "Service ${service_name} endpoint ready: ${endpoint}"
                return 0
              fi
              retry=$((retry + 1))
              sleep 5
            done
            echo "ERROR: service ${service_name} did not expose endpoints in time."
            return 1
          }

          get_secret_value() {
            secret_name="$1"
            secret_key="$2"
            kubectl -n "${NS}" get secret "${secret_name}" -o "jsonpath={.data['${secret_key}']}" 2>/dev/null | base64 -d 2>/dev/null || true
          }

          wait_for_api_ready() {
            max_retries=120
            retry=0
            while [ "${retry}" -lt "${max_retries}" ]; do
              http_code="$(curl -s -o /dev/null -w "%{http_code}" "${ST2_API_URL}/v1/actions" || true)"
              if [ "${http_code}" = "200" ] || [ "${http_code}" = "401" ]; then
                echo "StackStorm API ready (HTTP ${http_code})"
                return 0
              fi
              retry=$((retry + 1))
              sleep 5
            done
            echo "ERROR: StackStorm API did not become ready."
            return 1
          }

          get_auth_token() {
            user="$1"
            pass="$2"
            response="$(curl -s -X POST "${ST2_AUTH_URL}/tokens" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${user}\",\"password\":\"${pass}\"}" || true)"
            echo "${response}" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1
          }

          create_api_key() {
            token="$1"
            response="$(curl -s -X POST "${ST2_API_URL}/v1/apikeys" \
              -H "X-Auth-Token: ${token}" \
              -H "Content-Type: application/json" \
              -d '{"description":"PoundCake-Internal"}' || true)"
            echo "${response}" | sed -n 's/.*"key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1
          }

          validate_api_key() {
            key="$1"
            http_code="$(curl -s -o /dev/null -w "%{http_code}" -H "St2-Api-Key: ${key}" "${ST2_API_URL}/v1/actions" || true)"
            [ "${http_code}" = "200" ]
          }

          upsert_api_key_secret() {
            api_key="$1"
            encoded="$(printf "%s" "${api_key}" | base64 | tr -d '\n')"
            if kubectl -n "${NS}" get secret "${API_KEY_SECRET}" >/dev/null 2>&1; then
              kubectl -n "${NS}" patch secret "${API_KEY_SECRET}" --type merge \
                -p "{\"data\":{\"${API_KEY_FIELD}\":\"${encoded}\"}}" >/dev/null
            else
              kubectl -n "${NS}" create secret generic "${API_KEY_SECRET}" \
                --from-literal="${API_KEY_FIELD}=${api_key}" >/dev/null
            fi
          }

          ensure_api_key_secret() {
            st2_auth_user="${ST2_AUTH_USER_DEFAULT}"
            st2_auth_password=""

            discovered_user="$(get_secret_value "${ST2_AUTH_SECRET}" "username")"
            if [ -n "${discovered_user}" ]; then
              st2_auth_user="${discovered_user}"
            fi

            st2_auth_password="$(get_secret_value "${ST2_AUTH_SECRET}" "password")"
            if [ -z "${st2_auth_password}" ] && [ -n "${ST2_ADMIN_PASSWORD_SECRET}" ] && [ -n "${ST2_ADMIN_PASSWORD_KEY}" ]; then
              st2_auth_password="$(get_secret_value "${ST2_ADMIN_PASSWORD_SECRET}" "${ST2_ADMIN_PASSWORD_KEY}")"
            fi

            if [ -z "${st2_auth_password}" ]; then
              echo "ERROR: unable to resolve StackStorm admin password."
              return 1
            fi

            existing_key="$(get_secret_value "${API_KEY_SECRET}" "${API_KEY_FIELD}")"
            if [ -n "${existing_key}" ] && validate_api_key "${existing_key}"; then
              echo "Existing StackStorm API key is valid."
              return 0
            fi

            attempt=0
            while [ "${attempt}" -lt 20 ]; do
              attempt=$((attempt + 1))
              token="$(get_auth_token "${st2_auth_user}" "${st2_auth_password}")"
              if [ -n "${token}" ]; then
                new_key="$(create_api_key "${token}")"
                if [ -n "${new_key}" ] && validate_api_key "${new_key}"; then
                  upsert_api_key_secret "${new_key}"
                  echo "Generated and stored StackStorm API key."
                  return 0
                fi
              fi
              sleep 4
            done
            echo "ERROR: failed to create a valid StackStorm API key."
            return 1
          }

          echo "Stage 2: waiting for StackStorm infra services."
          kubectl -n "${NS}" delete secret "${READY_SECRET}" --ignore-not-found >/dev/null
          wait_for_service_endpoints "{{ include "poundcake.stackstormMongoName" . }}"
          wait_for_service_endpoints "{{ include "poundcake.stackstormRabbitmqName" . }}"
          wait_for_service_endpoints "{{ include "poundcake.stackstormRedisName" . }}"

          echo "Stage 3: ensuring core services are running."
          scale_component_if_exists "st2register" {{ .Values.stackstorm.startupOrder.coreReplicas.st2register | int }}
          scale_component_if_exists "st2auth" {{ .Values.stackstorm.startupOrder.coreReplicas.st2auth | int }}
          scale_component_if_exists "st2api" {{ .Values.stackstorm.startupOrder.coreReplicas.st2api | int }}
          wait_component_rollout_if_exists "st2register"
          wait_component_rollout_if_exists "st2auth"
          wait_component_rollout_if_exists "st2api"
          wait_for_api_ready

          echo "Stage 4: generating StackStorm API key."
          ensure_api_key_secret
{{- end }}
