          args: ["/opt/stackstorm/st2/bin/st2web", "--config-file", "/etc/st2/st2.conf"]
          volumeMounts:
            - name: stackstorm-config
              mountPath: /etc/st2/st2.conf.template
              subPath: st2.conf.template
            - name: scripts
              mountPath: /st2-entrypoint.sh
              subPath: st2-entrypoint.sh
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: stackstorm-config
          configMap:
            name: stackstorm-config
        - name: scripts
          configMap:
            name: stackstorm-scripts
            defaultMode: 0755
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackstorm-client
  labels:
    app.kubernetes.io/component: stackstorm-client
    {{- include "poundcake-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: stackstorm-client
      {{- include "poundcake-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: stackstorm-client
        {{- include "poundcake-standalone.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-stage7
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until [ -s /app/config/stackstorm_bootstrap_ready ]; do sleep 2; done; until [ -s /app/config/st2_api_key ]; do sleep 2; done"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      containers:
        - name: stackstorm-client
          image: {{ .Values.stackstormImage.repository }}:{{ .Values.stackstormImage.tag }}
          imagePullPolicy: {{ .Values.stackstormImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: stackstorm-secrets
          command: ["/bin/bash", "/st2-entrypoint.sh"]
          args: ["sh", "-c", "echo 'stackstorm-client ready' && tail -f /dev/null"]
          volumeMounts:
            - name: stackstorm-config
              mountPath: /etc/st2/st2.conf.template
              subPath: st2.conf.template
            - name: scripts
              mountPath: /st2-entrypoint.sh
              subPath: st2-entrypoint.sh
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: stackstorm-config
          configMap:
            name: stackstorm-config
        - name: scripts
          configMap:
            name: stackstorm-scripts
            defaultMode: 0755
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
