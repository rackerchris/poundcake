apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackstorm-register
  labels:
    app.kubernetes.io/component: stackstorm-register
    {{- include "poundcake-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: stackstorm-register
      {{- include "poundcake-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: stackstorm-register
        {{- include "poundcake-standalone.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-stage2
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until [ -s /app/config/stackstorm_infra_ready ]; do sleep 2; done"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      containers:
        - name: stackstorm-register
          image: {{ .Values.stackstormImage.repository }}:{{ .Values.stackstormImage.tag }}
          imagePullPolicy: {{ .Values.stackstormImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: stackstorm-secrets
          command: ["/bin/bash", "/st2-entrypoint.sh"]
          args:
            - /bin/bash
            - -ec
            - |
              while true; do
                st2-register-content --register-all --register-fail-on-failure --config-file /etc/st2/st2.conf || true
                sleep 300
              done
          volumeMounts:
            - name: stackstorm-config
              mountPath: /etc/st2/st2.conf.template
              subPath: st2.conf.template
            - name: scripts
              mountPath: /st2-entrypoint.sh
              subPath: st2-entrypoint.sh
            - name: packs
              mountPath: /opt/stackstorm/packs/poundcake
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: stackstorm-config
          configMap:
            name: stackstorm-config
        - name: scripts
          configMap:
            name: stackstorm-scripts
            defaultMode: 0755
        - name: packs
          persistentVolumeClaim:
            claimName: stackstorm-packs
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
---
