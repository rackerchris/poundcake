{{- if .Values.poundcake.enabled }}
{{- if eq (include "poundcake.databaseMode" .) "embedded" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poundcake-mariadb
  labels:
    app.kubernetes.io/component: mariadb
    {{- include "poundcake.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: mariadb
      {{- include "poundcake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mariadb
        {{- include "poundcake.logLabelsForComponent" (dict "component" "mariadb") | nindent 8 }}
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- include "poundcake.podPlacement" . | nindent 6 }}
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_NAME
            - name: MYSQL_MIGRATOR_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_MIGRATOR_USER
            - name: MYSQL_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_MIGRATOR_PASSWORD
            - name: MYSQL_PLUGIN_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PLUGIN_REGISTRY_USER
            - name: MYSQL_PLUGIN_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PLUGIN_REGISTRY_PASSWORD
            - name: MYSQL_API_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_API_USER
            - name: MYSQL_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_API_PASSWORD
            - name: MYSQL_AUTH_VERIFIER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_AUTH_VERIFIER_USER
            - name: MYSQL_AUTH_VERIFIER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_AUTH_VERIFIER_PASSWORD
            - name: MYSQL_SERVICE_IDENTITY_MANAGER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_SERVICE_IDENTITY_MANAGER_USER
            - name: MYSQL_SERVICE_IDENTITY_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_SERVICE_IDENTITY_MANAGER_PASSWORD
            - name: MYSQL_CREDENTIAL_MANAGER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_CREDENTIAL_MANAGER_USER
            - name: MYSQL_CREDENTIAL_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_CREDENTIAL_MANAGER_PASSWORD
            - name: MYSQL_PLUGIN_OPERATION_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PLUGIN_OPERATION_USER
            - name: MYSQL_PLUGIN_OPERATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PLUGIN_OPERATION_PASSWORD
            - name: MYSQL_PREP_CHEF_READER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PREP_CHEF_READER_USER
            - name: MYSQL_PREP_CHEF_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_PREP_CHEF_READER_PASSWORD
            - name: MYSQL_TIMER_READER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_TIMER_READER_USER
            - name: MYSQL_TIMER_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_TIMER_READER_PASSWORD
            - name: MYSQL_EXPEDITER_RUNNER_READER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_EXPEDITER_RUNNER_READER_USER
            - name: MYSQL_EXPEDITER_RUNNER_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_EXPEDITER_RUNNER_READER_PASSWORD
            - name: MYSQL_DISHWASHER_READER_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_DISHWASHER_READER_USER
            - name: MYSQL_DISHWASHER_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_DISHWASHER_READER_PASSWORD
            - name: MYSQL_READONLY_USER
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_READONLY_USER
            - name: MYSQL_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poundcake-secrets
                  key: DB_READONLY_PASSWORD
            - name: POUNDCAKE_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: scripts
              mountPath: /docker-entrypoint-initdb.d/01-create-databases.sh
              subPath: mariadb-init.sh
          readinessProbe:
            exec:
              command: ["sh", "-c", "healthcheck.sh --connect --innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
          startupProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          {{- if .Values.infraSecurityContext.mariadb }}
          securityContext:
            {{- toYaml .Values.infraSecurityContext.mariadb | nindent 12 }}
          {{- end }}
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: poundcake-mariadb
        - name: scripts
          configMap:
            name: poundcake-scripts
            defaultMode: 0755
{{- end }}
{{- end }}
