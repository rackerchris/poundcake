apiVersion: apps/v1
kind: Deployment
metadata:
  name: poundcake-dishwasher
  labels:
    app.kubernetes.io/component: dishwasher
    {{- include "poundcake-standalone.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dishwasher
      {{- include "poundcake-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dishwasher
        {{- include "poundcake-standalone.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-api
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until nc -z poundcake-api 8000; do sleep 2; done; until [ -s /app/config/stackstorm_bootstrap_ready ]; do sleep 2; done"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      containers:
        - name: dishwasher
          image: {{ .Values.poundcakeImage.repository }}:{{ .Values.poundcakeImage.tag }}
          imagePullPolicy: {{ .Values.poundcakeImage.pullPolicy }}
          workingDir: /app
          command: ["python3", "kitchen/dishwasher.py"]
          env:
            - name: PYTHONPATH
              value: /app
            - name: POUNDCAKE_API_URL
              value: http://poundcake-api:8000
            - name: LOG_LEVEL
              value: INFO
            - name: POUNDCAKE_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: DISHWASHER_DEFAULT_DURATION
              value: "60"
            - name: DISHWASHER_DEFAULT_TIMEOUT
              value: "300"
            - name: DISHWASHER_PRUNE_MISSING
              value: "false"
            - name: DISHWASHER_INTERVAL
              value: {{ .Values.intervals.dishwasher | quote }}
            - name: SERVICE_NAME
              value: dishwasher
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
