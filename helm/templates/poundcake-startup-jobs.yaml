{{- if .Values.poundcake.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: poundcake-mariadb-ready
  labels:
    app.kubernetes.io/component: poundcake-mariadb-ready
    {{- include "poundcake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": {{ include "poundcake.startupHookDeletePolicy" . | quote }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.startupHooks.cleanup.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: poundcake-mariadb-ready
        {{- include "poundcake.logLabelsForComponent" (dict "component" "poundcake-mariadb-ready") | nindent 8 }}
        {{- include "poundcake.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- include "poundcake.podPlacement" . | nindent 6 }}
      serviceAccountName: poundcake-startup
      restartPolicy: OnFailure
      containers:
        - name: wait-mariadb
          image: {{ .Values.images.kubectl }}
          securityContext:
            {{- toYaml .Values.utilitySecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              NS="{{ .Release.Namespace }}"
              DB_NS="{{ include "poundcake.databaseServiceNamespace" . }}"
              DB_SVC="{{ include "poundcake.databaseServerName" . }}"
              DB_HOST="{{ include "poundcake.databaseHost" . }}"
              {{- include "poundcake.gateLogHelpers" . | nindent 14 }}
              gate_log_wait_start "poundcake-mariadb-ready" "service endpoint ${DB_SVC} (${DB_HOST})"
              until [ -n "$(kubectl -n "${DB_NS}" get endpoints "${DB_SVC}" -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)" ]; do
                gate_log_wait_tick "poundcake-mariadb-ready" "service endpoint ${DB_SVC} (${DB_HOST})"
                sleep 2
              done
              gate_log_wait_ready "poundcake-mariadb-ready"
---
