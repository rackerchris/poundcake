{{- if .Values.poundcake.enabled }}

{{- if .Values.auth.enabled }}
{{- $secretName := printf "%s-admin" (include "poundcake.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $adminPassword := "" }}
{{- if $existingSecret }}
  {{- $adminPassword = index $existingSecret.data "password" | b64dec }}
{{- else }}
  {{- $adminPassword = randAlphaNum 24 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  username: {{ "admin" | b64enc | quote }}
  password: {{ $adminPassword | b64enc | quote }}
{{- end }}

{{- $existingPound := (lookup "v1" "Secret" .Release.Namespace "poundcake-secrets") | default dict }}
{{- $poundData := (dig "data" (dict) $existingPound) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: poundcake-secrets
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_ROOT_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_ROOT_PASSWORD" | default "" | b64dec)) .Values.secrets.dbRootPassword | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  DB_MIGRATOR_USER: {{ .Values.secrets.dbMigratorUser | quote }}
  DB_MIGRATOR_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_MIGRATOR_PASSWORD" | default "" | b64dec)) .Values.secrets.dbMigratorPassword | quote }}
  DB_PLUGIN_REGISTRY_USER: {{ .Values.secrets.dbPluginRegistryUser | quote }}
  DB_PLUGIN_REGISTRY_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_PLUGIN_REGISTRY_PASSWORD" | default "" | b64dec)) .Values.secrets.dbPluginRegistryPassword | quote }}
  DB_API_USER: {{ .Values.secrets.dbApiUser | quote }}
  DB_API_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_API_PASSWORD" | default "" | b64dec)) .Values.secrets.dbApiPassword | quote }}
  DB_AUTH_VERIFIER_USER: {{ .Values.secrets.dbAuthVerifierUser | quote }}
  DB_AUTH_VERIFIER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_AUTH_VERIFIER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbAuthVerifierPassword | quote }}
  DB_SERVICE_IDENTITY_MANAGER_USER: {{ .Values.secrets.dbServiceIdentityManagerUser | quote }}
  DB_SERVICE_IDENTITY_MANAGER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_SERVICE_IDENTITY_MANAGER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbServiceIdentityManagerPassword | quote }}
  DB_CREDENTIAL_MANAGER_USER: {{ .Values.secrets.dbCredentialManagerUser | quote }}
  DB_CREDENTIAL_MANAGER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_CREDENTIAL_MANAGER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbCredentialManagerPassword | quote }}
  DB_PLUGIN_OPERATION_USER: {{ .Values.secrets.dbPluginOperationUser | quote }}
  DB_PLUGIN_OPERATION_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_PLUGIN_OPERATION_PASSWORD" | default "" | b64dec)) .Values.secrets.dbPluginOperationPassword | quote }}
  DB_PREP_CHEF_READER_USER: {{ .Values.secrets.dbPrepChefReaderUser | quote }}
  DB_PREP_CHEF_READER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_PREP_CHEF_READER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbPrepChefReaderPassword | quote }}
  DB_TIMER_READER_USER: {{ .Values.secrets.dbTimerReaderUser | quote }}
  DB_TIMER_READER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_TIMER_READER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbTimerReaderPassword | quote }}
  DB_EXPEDITER_RUNNER_READER_USER: {{ .Values.secrets.dbExpediterRunnerReaderUser | quote }}
  DB_EXPEDITER_RUNNER_READER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_EXPEDITER_RUNNER_READER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbExpediterRunnerReaderPassword | quote }}
  DB_DISHWASHER_READER_USER: {{ .Values.secrets.dbDishwasherReaderUser | quote }}
  DB_DISHWASHER_READER_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_DISHWASHER_READER_PASSWORD" | default "" | b64dec)) .Values.secrets.dbDishwasherReaderPassword | quote }}
  DB_READONLY_USER: {{ .Values.secrets.dbReadonlyUser | quote }}
  DB_READONLY_PASSWORD: {{ default (default (randAlphaNum 24) (get $poundData "DB_READONLY_PASSWORD" | default "" | b64dec)) .Values.secrets.dbReadonlyPassword | quote }}
  PLUGIN_CREDENTIAL_ENCRYPTION_KEY: {{ default (default (randAlphaNum 48) (get $poundData "PLUGIN_CREDENTIAL_ENCRYPTION_KEY" | default "" | b64dec)) .Values.secrets.pluginCredentialEncryptionKey | quote }}
  SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY: {{ default (default (randAlphaNum 48) (get $poundData "SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY" | default "" | b64dec)) .Values.secrets.serviceIdentityCredentialEncryptionKey | quote }}
  WEBHOOK_BEARER_TOKEN: {{ default (default (randAlphaNum 48) (get $poundData "WEBHOOK_BEARER_TOKEN" | default "" | b64dec)) .Values.secrets.webhookBearerToken | quote }}

{{- end }}
