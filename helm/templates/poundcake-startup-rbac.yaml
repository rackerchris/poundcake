{{- if .Values.poundcake.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poundcake-startup
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: poundcake-startup
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: poundcake-startup
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: poundcake-startup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: poundcake-startup
{{- end }}
