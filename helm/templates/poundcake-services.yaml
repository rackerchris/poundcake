{{- if .Values.poundcake.enabled }}
{{- if eq (include "poundcake.databaseMode" .) "embedded" }}
apiVersion: v1
kind: Service
metadata:
  name: poundcake-mariadb
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/release": {{ .Release.Name | quote }}
    "helm.sh/chart": {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    "helm.sh/namespace": {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mariadb
    {{- include "poundcake.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: poundcake-api
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/release": {{ .Release.Name | quote }}
    "helm.sh/chart": {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    "helm.sh/namespace": {{ .Release.Namespace | quote }}
spec:
  type: {{ .Values.services.api.type }}
  publishNotReadyAddresses: {{ .Values.services.api.publishNotReadyAddresses }}
  selector:
    app.kubernetes.io/component: api
    {{- include "poundcake.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.api.port }}
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: poundcake-ui
  labels:
    {{- include "poundcake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/release": {{ .Release.Name | quote }}
    "helm.sh/chart": {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    "helm.sh/namespace": {{ .Release.Namespace | quote }}
spec:
  type: {{ .Values.services.ui.type }}
  selector:
    app.kubernetes.io/component: ui
    {{- include "poundcake.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.ui.port }}
      targetPort: {{ .Values.uiImage.containerPort }}
{{- end }}
