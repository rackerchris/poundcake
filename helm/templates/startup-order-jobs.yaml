apiVersion: batch/v1
kind: Job
metadata:
  name: stackstorm-bootstrap
  labels:
    app.kubernetes.io/component: stackstorm-bootstrap
    {{- include "poundcake-standalone.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "7"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: stackstorm-bootstrap
        {{- include "poundcake-standalone.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-stage6
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until [ -s /app/config/stackstorm_edge_ready ]; do sleep 2; done"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      containers:
        - name: stackstorm-bootstrap
          image: {{ .Values.stackstormImage.repository }}:{{ .Values.stackstormImage.tag }}
          imagePullPolicy: {{ .Values.stackstormImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: stackstorm-secrets
          env:
            - name: ST2_AUTH_URL
              value: http://stackstorm-auth:9100
            - name: ST2_API_URL
              value: http://stackstorm-api:9101
          command: ["/bin/bash", "/st2-entrypoint.sh"]
          args:
            - /bin/bash
            - -ec
            - |
              /automated-setup.sh
              echo ready > /app/config/stackstorm_bootstrap_ready
          volumeMounts:
            - name: stackstorm-config
              mountPath: /etc/st2/st2.conf.template
              subPath: st2.conf.template
            - name: scripts
              mountPath: /st2-entrypoint.sh
              subPath: st2-entrypoint.sh
            - name: scripts
              mountPath: /automated-setup.sh
              subPath: automated-setup.sh
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: stackstorm-config
          configMap:
            name: stackstorm-config
        - name: scripts
          configMap:
            name: stackstorm-scripts
            defaultMode: 0755
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
---
