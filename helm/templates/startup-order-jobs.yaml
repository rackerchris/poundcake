apiVersion: batch/v1
kind: Job
metadata:
  name: poundcake-bootstrap
  labels:
    app.kubernetes.io/component: poundcake-bootstrap
    {{- include "poundcake-standalone.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: poundcake-bootstrap
        {{- include "poundcake-standalone.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-stackstorm-bootstrap
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until [ -s /app/config/stackstorm_bootstrap_ready ]; do sleep 2; done"]
          volumeMounts:
            - name: app-config
              mountPath: /app/config
        - name: wait-api
          image: {{ .Values.images.busybox }}
          command: ["sh", "-c", "until nc -z poundcake-api 8000; do sleep 2; done"]
      containers:
        - name: poundcake-bootstrap
          image: {{ .Values.poundcakeImage.repository }}:{{ .Values.poundcakeImage.tag }}
          imagePullPolicy: {{ .Values.poundcakeImage.pullPolicy }}
          workingDir: /app
          command:
            - /bin/bash
            - -ec
            - |
              python3 kitchen/dishwasher.py
              echo ready > /app/config/poundcake_bootstrap_ready
          env:
            - name: PYTHONPATH
              value: /app
            - name: POUNDCAKE_API_URL
              value: http://poundcake-api:8000
            - name: LOG_LEVEL
              value: INFO
            - name: POUNDCAKE_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: DISHWASHER_DEFAULT_DURATION
              value: "60"
            - name: DISHWASHER_DEFAULT_TIMEOUT
              value: "300"
            - name: DISHWASHER_PRUNE_MISSING
              value: "false"
            - name: DISHWASHER_INTERVAL
              value: "0"
            - name: POUNDCAKE_BOOTSTRAP_MARK
              value: "true"
          volumeMounts:
            - name: app-config
              mountPath: /app/config
      volumes:
        - name: app-config
          persistentVolumeClaim:
            claimName: poundcake-config
