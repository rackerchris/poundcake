# Combined sample overrides for PoundCake Helm installs.
# Copy to:
#   /etc/genestack/helm-configs/poundcake/poundcake-helm-overrides.yaml
#
# Startup order (managed by hook weights and marker secrets):
#
#   Phase 0 — pre-install hooks (weight -20):
#     - Generate secrets: MariaDB root/user, StackStorm admin password,
#       StackStorm API key placeholder, PoundCake admin auth secret.
#
#   Phase 1 — StackStorm core init (post-install, weight 10):
#     Job: <release>-stackstorm-core-init
#     - Waits for StackStorm infra endpoints (mongodb/rabbitmq/redis)
#     - Ensures core ST2 deployments are running: st2register/st2auth/st2api
#     - Generates/validates st2_api_key secret used by PoundCake.
#
#   Phase 2 — StackStorm workers (post-install, weight 11):
#     Job: <release>-stackstorm-workers-init
#     - Scales worker/execution components.
#
#   Phase 3 — StackStorm edge (post-install, weight 12):
#     Job: <release>-stackstorm-edge-init
#     - Scales edge components.
#
#   Phase 4 — StackStorm bootstrap (post-install, weight 13):
#     Job: <release>-stackstorm-bootstrap
#     - Registers packs/content.
#     - Writes marker secret: <release>-stackstorm-bootstrap-ready.
#
#   Phase 5 — PoundCake DB migration (post-install, weight 20):
#     Job: <release>-db-init
#     - Waits for StackStorm bootstrap marker (init container).
#     - Waits for MariaDB to accept connections.
#     - Runs Alembic migrations and seeds default data.
#
#   Phase 6 — Pack init (post-install, weight 30):
#     Job: <release>-pack-init
#     - Creates stackstorm-packs directory tree.
#
#   Phase 7 — PoundCake bootstrap (post-install, weight 40):
#     Job: <release>-bootstrap
#     - Waits for StackStorm bootstrap marker (init container).
#     - Waits for PoundCake API health green (init container).
#     - Runs dishwasher.py in bootstrap mode (reconciles ST2 content/state).
#     - Writes marker secret: <release>-poundcake-bootstrap-ready.
#
#   Phase 8 — Worker services start (Deployments):
#     chef, prep-chef, timer, dishwasher
#     - Each has a wait-for-poundcake-bootstrap init container that polls
#       the poundcake-bootstrap-ready marker secret before starting.
#
# ---

# Main API deployment (service load balances across pods)
replicaCount: 1

# Worker services
chef:
  enabled: true
  replicaCount: 1

prepChef:
  enabled: true
  replicaCount: 1

timer:
  enabled: true
  replicaCount: 1

dishwasher:
  enabled: true
  replicaCount: 1

# Bootstrap jobs
bootstrap:
  packInit:
    enabled: true
  poundcakeBootstrap:
    enabled: true

# Expose API with a cloud LB
service:
  type: LoadBalancer
  port: 8080

# Required for multi-replica state coordination
redis:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Keep StackStorm resources on st2-* naming.
stackstorm:
  subchart:
    fullnameOverride: "st2"
  # Enable staged StackStorm startup.
  startupOrder:
    enabled: true
    coreReplicas:
      st2register: 1
      st2auth: 1
      st2api: 1
    workerReplicas:
      st2actionrunner: 1
      st2rulesengine: 1
      st2workflowengine: 1
      st2scheduler: 1
      st2notifier: 1
      st2garbagecollector: 1
      st2timersengine: 1
      st2chatops: 1
    edgeReplicas:
      st2stream: 1
      st2sensorcontainer: 1
      st2web: 1

stackstorm-chart:
  fullnameOverride: "st2"

# Envoy Gateway route/listener configuration
gateway:
  enabled: true
  gatewayName: "envoy-gateway"
  gatewayNamespace: "envoy-gateway-system"
  listener:
    name: "poundcake-https"
    hostname: "poundcake.api.kronos.cloudmunchers.net"
    port: 443
    protocol: "HTTPS"
    tlsSecretName: "poundcake-gw-tls-secret"
    allowedNamespaces: "All"
    updateIfExists: true
  hostnames:
    - "poundcake.api.kronos.cloudmunchers.net"
  annotations: {}
